<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Company Portal</title>
    <link rel="stylesheet" href="employee_login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Employee Portal</h1>
            <p>Sign in to access your account</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage" style="display: none;">
            <h3>Login Successful!</h3>
            <p>Redirecting to dashboard in <span id="countdown">3</span> seconds...</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="employeeId">Employee ID</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="EMP-123456" maxlength="10" required>
                <div class="error-message" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#" class="forgot-password" onclick="alert('Password reset link sent!'); return false;">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="login-link">
            <p>No account? <a href="#" id="createAccount" class="create-account-link">Create Employee Account</a></p>
            <p><a href="#" id="backToSelection" class="back-link">← Back to Selection</a></p>
        </div>
    </div>
    
    <script src="employee_login.js"></script>
</body>
</html>
