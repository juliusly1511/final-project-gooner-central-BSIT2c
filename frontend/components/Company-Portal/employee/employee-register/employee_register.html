<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration - Company Portal</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="employee_register.css">
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>Create Employee Account</h1>
            <p>Join our employee portal</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage" style="display: none;">
            <h3>Account Created Successfully!</h3>
            <p>Redirecting to login in <span id="countdown">3</span> seconds...</p>
        </div>

        <form id="employeeRegisterForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Work Email *</label>
                <input type="email" id="email" name="email" placeholder="john.doe@company.com" required>
            </div>

            <div class="form-group">
                <label for="employeeId">Employee ID *</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="EMP-001234" required>
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="engineering">Engineering</option>
                    <option value="marketing">Marketing</option>
                    <option value="sales">Sales</option>
                    <option value="hr">Human Resources</option>
                    <option value="finance">Finance</option>
                    <option value="operations">Operations</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
            </div>

            <div class="password-group">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="Create password" required minlength="8">
                    <div class="strength-indicator" id="strengthIndicator"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                </div>
            </div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the <a href="#" class="terms">Terms & Conditions</a> *
                </label>
            </div>

            <button type="submit" class="register-btn">Create Account</button>
        </form>

<div class="login-link">
    <p>
        Already have an account? 
        <a href="#" onclick="navigateTo.employeeLogin(); return false;">Sign in here</a>
    </p>
    <p>
        <a href="#" onclick="navigateTo.selection(); return false;">← Back to Selection</a>
    </p>
</div>

    <script src="employee_register.js"></script>
</body>
</html>
