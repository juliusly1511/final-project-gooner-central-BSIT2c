<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Connect - Select Role</title>
    <link rel="stylesheet" href="Selection.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Job Connect</h1>
            <p>Please select your role to continue</p>
        </div>

        <div class="role-cards">
            <div class="role-card employee" data-role="employee">
                <div class="role-icon">👤</div>
                <div class="role-title">Employee</div>
                <div class="role-desc">Access timesheets, payroll, job applications, and HR services</div>
                <div class="role-links">
                    <a href="#" onclick="navigateTo.employeeLogin(); return false;">Login</a>
                    /
                    <a href="#" onclick="navigateTo.employeeRegister(); return false;">Register</a>
                </div>
            </div>

            <div class="role-card employer" data-role="employer">
                <div class="role-icon">🏢</div>
                <div class="role-title">Employer</div>
                <div class="role-desc">Manage employees, payroll, job postings, and company settings</div>
                <div class="role-links">
                    <a href="#" onclick="navigateTo.employerLogin(); return false;">Login</a>
                    /
                    <a href="#" onclick="navigateTo.employerRegister(); return false;">Register</a>
                </div>
            </div>
        </div>

        <div class="footer-links">
            <a href="#" onclick="alert('Contact IT support'); return false;">Need help?</a>
        </div>
    </div>

    <script src="Selection.js"></script>
</body>
</html>
