<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Login - Company Portal</title>
    <link rel="stylesheet" href="employer_login.css">
</head>
<body>
    <div class="login-container employer-theme">
        <div class="logo">
            <h1>Employer Portal</h1>
            <p>Manage your company and employees</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage" style="display: none;">
            <h3>Login Successful!</h3>
            <p>Redirecting to employer dashboard in <span id="countdown">3</span> seconds...</p>
        </div>

        <form id="employerLoginForm">
            <div class="form-group">
                <label for="companyId">Company ID</label>
                <input type="text" id="companyId" name="companyId" placeholder="COMP-001234" required>
            </div>

            <div class="form-group">
                <label for="employerPassword">Password</label>
                <input type="password" id="employerPassword" name="employerPassword" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#" class="forgot-password" onclick="alert('Password reset link sent to admin!'); return false;">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn employer-btn">Employer Sign In</button>
        </form>

        <div class="login-link">
            <p>No employer account? <a href="#" onclick="navigateTo.employerRegister(); return false;">Create Employer Account</a></p>
            <p><a href="#" onclick="navigateTo.selection(); return false;">← Back to Selection</a></p>
        </div>
    </div>

    <script src="employer_login.js"></script>
</body>
</html>
